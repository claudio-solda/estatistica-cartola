<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Brasileirão 2026 - Pontuação</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brasileirão 26">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #3b82f6;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      padding-top: calc(20px + env(safe-area-inset-top));
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin: 0;
    }
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .btn-copy {
      background-color: var(--accent-amber);
    }
    .btn-copy:hover {
      background-color: #d97706;
    }
    .grid-tables {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 768px) {
      .grid-tables {
        grid-template-columns: 1fr;
      }
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title.conquistados { color: var(--accent-amber); }
    .card-title.cedidos { color: var(--accent-red); }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #334155;
    }
    th {
      color: var(--text-sub);
      font-weight: 500;
    }
    .val-highlight {
      font-weight: bold;
    }
    #toast {
      visibility: hidden;
      min-width: 200px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 8px;
      padding: 12px;
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 0.9rem;
    }
    #toast.show {
      visibility: visible;
      animation: fadein 0.3s, fadeout 0.3s 2.7s;
    }
    @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
    @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }

    #install-btn {
      display: none;
      background-color: #334155;
    }
    #install-btn.show { display: flex; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Brasileirão 2026 — Desempenho & Pontuação</h1>
    <p class="subtitle">Ranking de Pontos Conquistados e Pontos Cedidos (Gols Sofridos / Perdas)</p>
  </header>

  <div class="action-bar">
    <button class="btn btn-copy" onclick="copiarRelatorio()">
      📋 Copiar Dados da Tela
    </button>
    <button class="btn" onclick="carregarDadosAoVivo(true)">
      🔄 Atualizar Dados
    </button>
    <button class="btn" id="install-btn" onclick="instalarApp()">
      ⬇️ Instalar App
    </button>
  </div>
  <p id="status-dados" class="subtitle" style="text-align:center;margin-bottom:16px;"></p>

  <div class="grid-tables">
    <!-- Mais Conquistaram Pontos -->
    <div class="card">
      <div class="card-title conquistados">
        📈 Mais Conquistaram Pontos (Top 10)
      </div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Time</th>
            <th>V-E-D</th>
            <th>SG</th>
            <th>Pontos</th>
            <th>Forma</th>
          </tr>
        </thead>
        <tbody id="tb-conquistados"></tbody>
      </table>
    </div>

    <!-- Mais Cederam Pontos -->
    <div class="card">
      <div class="card-title cedidos">
        📉 Mais Cederam Pontos (Top 10)
      </div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Time</th>
            <th>Derrotas</th>
            <th>Pontos Cedidos</th>
            <th>Forma</th>
          </tr>
        </thead>
        <tbody id="tb-cedidos"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="toast">Dados copiados com sucesso!</div>

<script>
  // Dados locais (usados como ponto de partida e como reserva se a busca ao vivo falhar)
  let dadosTimes = [
    { nome: "Flamengo", pontos: 54, jogos: 26, vitorias: 16, empates: 6, derrotas: 4, golsPro: 48, golsContra: 24, pontosPerdidos: 24, forma: [] },
    { nome: "Palmeiras", pontos: 53, jogos: 26, vitorias: 16, empates: 5, derrotas: 3, golsPro: 46, golsContra: 25, pontosPerdidos: 25, forma: [] },
    { nome: "Athletico-PR", pontos: 45, jogos: 26, vitorias: 13, empates: 6, derrotas: 7, golsPro: 40, golsContra: 33, pontosPerdidos: 33, forma: [] },
    { nome: "Fluminense", pontos: 45, jogos: 26, vitorias: 12, empates: 9, derrotas: 5, golsPro: 38, golsContra: 30, pontosPerdidos: 33, forma: [] },
    { nome: "Bahia", pontos: 43, jogos: 26, vitorias: 12, empates: 7, derrotas: 5, golsPro: 37, golsContra: 28, pontosPerdidos: 35, forma: [] },
    { nome: "Cruzeiro", pontos: 42, jogos: 26, vitorias: 11, empates: 9, derrotas: 8, golsPro: 33, golsContra: 30, pontosPerdidos: 36, forma: [] },
    { nome: "Coritiba", pontos: 37, jogos: 26, vitorias: 10, empates: 7, derrotas: 9, golsPro: 32, golsContra: 34, pontosPerdidos: 41, forma: [] },
    { nome: "Atlético-MG", pontos: 36, jogos: 25, vitorias: 9, empates: 9, derrotas: 9, golsPro: 30, golsContra: 32, pontosPerdidos: 39, forma: [] },
    { nome: "Red Bull Bragantino", pontos: 35, jogos: 25, vitorias: 9, empates: 8, derrotas: 10, golsPro: 30, golsContra: 34, pontosPerdidos: 40, forma: [] },
    { nome: "São Paulo", pontos: 33, jogos: 25, vitorias: 8, empates: 9, derrotas: 10, golsPro: 28, golsContra: 32, pontosPerdidos: 42, forma: [] },
    { nome: "Corinthians", pontos: 32, jogos: 26, vitorias: 8, empates: 10, derrotas: 10, golsPro: 27, golsContra: 33, pontosPerdidos: 46, forma: [] },
    { nome: "Santos", pontos: 32, jogos: 25, vitorias: 8, empates: 9, derrotas: 9, golsPro: 27, golsContra: 32, pontosPerdidos: 43, forma: [] },
    { nome: "Botafogo", pontos: 31, jogos: 25, vitorias: 7, empates: 10, derrotas: 10, golsPro: 26, golsContra: 32, pontosPerdidos: 44, forma: [] },
    { nome: "Vitória", pontos: 29, jogos: 25, vitorias: 7, empates: 8, derrotas: 12, golsPro: 25, golsContra: 34, pontosPerdidos: 46, forma: [] },
    { nome: "Grêmio", pontos: 28, jogos: 24, vitorias: 6, empates: 10, derrotas: 10, golsPro: 24, golsContra: 30, pontosPerdidos: 44, forma: [] },
    { nome: "Mirassol", pontos: 28, jogos: 26, vitorias: 6, empates: 10, derrotas: 12, golsPro: 25, golsContra: 34, pontosPerdidos: 50, forma: [] },
    { nome: "Vasco da Gama", pontos: 25, jogos: 25, vitorias: 5, empates: 10, derrotas: 12, golsPro: 22, golsContra: 32, pontosPerdidos: 50, forma: [] },
    { nome: "Internacional", pontos: 25, jogos: 26, vitorias: 5, empates: 10, derrotas: 11, golsPro: 22, golsContra: 33, pontosPerdidos: 53, forma: [] },
    { nome: "Remo", pontos: 23, jogos: 26, vitorias: 5, empates: 8, derrotas: 13, golsPro: 20, golsContra: 34, pontosPerdidos: 55, forma: [] },
    { nome: "Chapecoense", pontos: 17, jogos: 25, vitorias: 3, empates: 8, derrotas: 14, golsPro: 18, golsContra: 36, pontosPerdidos: 58, forma: [] }
  ];

  const LEAGUE_ID = 4351; // Brazilian Serie A no TheSportsDB
  const API_KEY = 3; // chave pública gratuita de testes

  function formaHtml(forma) {
    if (!forma || !forma.length) return '<span style="color:#64748b">—</span>';
    const cores = { W: '#f59e0b', D: '#94a3b8', L: '#ef4444' };
    return forma.slice(-5).split('').map(r =>
      `<span style="display:inline-block;width:18px;height:18px;line-height:18px;border-radius:4px;font-size:0.65rem;text-align:center;font-weight:bold;background:${cores[r] || '#334155'};color:#0f172a;margin-right:2px;">${r}</span>`
    ).join('');
  }

  function renderizarTabelas() {
    // Ordenar mais conquistados (descendente)
    const conquistados = [...dadosTimes].sort((a, b) => b.pontos - a.pontos).slice(0, 10);
    const tbConquistados = document.getElementById('tb-conquistados');
    tbConquistados.innerHTML = conquistados.map((t, idx) => `
      <tr>
        <td>${idx + 1}º</td>
        <td>${t.nome}</td>
        <td>${t.vitorias}-${t.empates}-${t.derrotas}</td>
        <td>${t.golsPro - t.golsContra >= 0 ? '+' : ''}${t.golsPro - t.golsContra}</td>
        <td class="val-highlight" style="color:#f59e0b">${t.pontos} pts</td>
        <td>${formaHtml(t.forma)}</td>
      </tr>
    `).join('');

    // Ordenar mais cederam pontos (descendente por pontos cedidos/perdidos)
    const cedidos = [...dadosTimes].sort((a, b) => b.pontosPerdidos - a.pontosPerdidos).slice(0, 10);
    const tbCedidos = document.getElementById('tb-cedidos');
    tbCedidos.innerHTML = cedidos.map((t, idx) => `
      <tr>
        <td>${idx + 1}º</td>
        <td>${t.nome}</td>
        <td>${t.derrotas}</td>
        <td class="val-highlight" style="color:#ef4444">${t.pontosPerdidos} pts</td>
        <td>${formaHtml(t.forma)}</td>
      </tr>
    `).join('');
  }

  async function carregarDadosAoVivo(manual) {
    const status = document.getElementById('status-dados');
    if (manual) status.textContent = '🔄 Buscando dados ao vivo...';
    try {
      const resp = await fetch(`https://www.thesportsdb.com/api/v1/json/${API_KEY}/lookuptable.php?l=${LEAGUE_ID}&s=2026`);
      if (!resp.ok) throw new Error('Falha na resposta da API');
      const data = await resp.json();
      if (!data.table || !data.table.length) throw new Error('Tabela vazia');

      dadosTimes = data.table.map(t => {
        const jogos = parseInt(t.intPlayed) || 0;
        const pontos = parseInt(t.intPoints) || 0;
        return {
          nome: t.strTeam,
          pontos: pontos,
          jogos: jogos,
          vitorias: parseInt(t.intWin) || 0,
          empates: parseInt(t.intDraw) || 0,
          derrotas: parseInt(t.intLoss) || 0,
          golsPro: parseInt(t.intGoalsFor) || 0,
          golsContra: parseInt(t.intGoalsAgainst) || 0,
          pontosPerdidos: jogos * 3 - pontos,
          forma: t.strForm || ''
        };
      });

      renderizarTabelas();
      const agora = new Date().toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
      status.textContent = `✅ Dados ao vivo atualizados às ${agora}`;
    } catch (err) {
      console.log('Não foi possível buscar dados ao vivo:', err);
      renderizarTabelas();
      status.textContent = manual
        ? '📴 Não consegui buscar dados ao vivo agora — mostrando dados locais'
        : '📴 Mostrando dados locais (toque em Atualizar para tentar buscar ao vivo)';
    }
  }

  function copiarRelatorio() {
    const conquistados = [...dadosTimes].sort((a, b) => b.pontos - a.pontos).slice(0, 5);
    const cedidos = [...dadosTimes].sort((a, b) => b.pontosPerdidos - a.pontosPerdidos).slice(0, 5);

    let texto = "📊 RELATÓRIO DE PONTUAÇÃO BRASILEIRÃO 2026\n\n";

    texto += "📈 TOP 5 TIMES COM MAIS PONTOS CONQUISTADOS:\n";
    conquistados.forEach((t, i) => {
      texto += `${i + 1}. ${t.nome} - ${t.pontos} Pts (${t.jogos} jogos)\n`;
    });

    texto += "\n📉 TOP 5 TIMES QUE MAIS CEDERAM PONTOS:\n";
    cedidos.forEach((t, i) => {
      texto += `${i + 1}. ${t.nome} - ${t.pontosPerdidos} Pts Perdidos (${t.derrotas} derrotas)\n`;
    });

    navigator.clipboard.writeText(texto).then(() => {
      mostrarToast();
    }).catch(err => {
      alert("Erro ao copiar dados: " + err);
    });
  }

  function mostrarToast() {
    const toast = document.getElementById("toast");
    toast.className = "show";
    setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
  }

  carregarDadosAoVivo(false);

  // ---- PWA: registro do service worker + botão de instalar ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(err => {
        console.log('Falha ao registrar service worker:', err);
      });
    });
  }

  let deferredPrompt;
  const installBtn = document.getElementById('install-btn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('show');
  });

  function instalarApp() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      installBtn.classList.remove('show');
    });
  }

  window.addEventListener('appinstalled', () => {
    installBtn.classList.remove('show');
  });
</script>
</body>
</html>
